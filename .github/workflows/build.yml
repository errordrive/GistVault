name: Build GistVault Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Generate Checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/GistVault-v3.2-debug.apk || true
          cp app/build/outputs/apk/release/*.apk artifacts/GistVault-v3.2-release.apk || true
          cd artifacts
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GistVault-v3.2-debug
          path: artifacts/GistVault-v3.2-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GistVault-v3.2-release
          path: artifacts/GistVault-v3.2-release.apk
          retention-days: 30

      - name: Upload Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums.txt
          retention-days: 30

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GistVault-v3.2-debug.apk
            artifacts/GistVault-v3.2-release.apk
            artifacts/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
